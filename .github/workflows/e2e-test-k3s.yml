name: E2E Tests (k3s)

on:
  push:
    branches:
      - main
    paths:
      - "operator/**"
      - "testing/**"
      - ".github/workflows/e2e-test-k3s.yml"
  pull_request:
    branches:
      - main
    paths:
      - "operator/**"
      - "testing/**"
      - ".github/workflows/e2e-test-k3s.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  LOCAL_REGISTRY: registry.localhost:5000
  IMAGE_NAME: ${{ github.repository }}

jobs:
  run-e2e-tests:
    name: End-to-end tests on k3s (${{ matrix.k8s-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        k8s-version: [v1.24.7+k3s1, v1.25.3+k3s1, v1.26.4+k3s1]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.19"
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: operator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare local registry and start K3s cluster
        env:
          K3S_VERSION: ${{ matrix.k8s-version }}
        run: |
          chmod +x ./testing/k3s-setup.sh
          ./testing/k3s-setup.sh

      - name: Wait for Kubernetes API server and nodes
        run: |
          echo "Waiting for Kubernetes API server..."
          tries=0
          until kubectl get --raw /healthz > /dev/null 2>&1; do
            tries=$((tries + 1))
            if [ "$tries" -ge 300 ]; then
              echo "Timed out waiting for Kubernetes API server to become healthy"
              exit 1
            fi
            sleep 2
          done

          echo "Waiting for nodes to become ready..."
          tries=0
          until [[ $(kubectl get nodes -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}') == "True" ]]; do
            tries=$((tries + 1))
            if [ "$tries" -ge 300 ]; then
              echo "Timed out waiting for k3s nodes to become ready"
              exit 1
            fi
            sleep 2
          done
          kubectl get nodes

      - name: Build and push image to local registry
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request detected: building image for the local registry"
            docker build \
              --tag "${LOCAL_REGISTRY}/${IMAGE_NAME}:latest" \
              operator
            docker push "${LOCAL_REGISTRY}/${IMAGE_NAME}:latest"
          else
            echo "Push to main detected: reusing the freshly built GHCR image"
            docker pull "${REGISTRY}/${IMAGE_NAME}:latest"
            docker tag "${REGISTRY}/${IMAGE_NAME}:latest" "${LOCAL_REGISTRY}/${IMAGE_NAME}:latest"
            docker push "${LOCAL_REGISTRY}/${IMAGE_NAME}:latest"
          fi

      - name: Deploy to k3s cluster
        run: |
          kubectl apply -f deployment/deployment.yaml
          kubectl set image deployment/hello \
            hello="${LOCAL_REGISTRY}/${IMAGE_NAME}:latest" \
            --namespace default
          kubectl rollout status deployment/hello --timeout=300s

      - name: Run E2E tests
        run: |
          cd ./testing/go
          go mod download
          go test -v ./...
